name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Start disposable Supabase
        run: |
          sed -i 's/enable_confirmations = true/enable_confirmations = false/' supabase/config.toml
          # Email confirmation is disabled for disposable accounts; no mail inbox is needed.
          npx supabase start -x mailpit
      - name: Create ordinary local test accounts
        run: node scripts/prepare-local-e2e.mjs >> "$GITHUB_ENV"
      - run: npm run test:integration
      - run: npm run build
      - run: npm run test:e2e:auth
      - run: node scripts/check-dev-purchase-forms.mjs
      - if: always()
        run: npx supabase stop --no-backup
